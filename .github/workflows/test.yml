name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python examples/rough_draft.py
      - run: python tools/validate_midi.py output/rough_draft.mid
